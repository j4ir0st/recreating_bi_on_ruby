services:
  web:
    build: .
    volumes:
      - .:/rails
    # Ejecutar como root para evitar problemas de permisos en Windows con volúmenes montados
    user: root
    # Asegurar que se escuche en todas las interfaces (0.0.0.0) y limpiar PID previo
    command: /bin/sh -c "dos2unix bin/* && rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_RELATIVE_URL_ROOT=${RELATIVE_URL}
      - API_BASE_URL=${BACKEND_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
